<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Altsis 원점 · 24초</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="promo.css" />
  </head>
  <body>
    <div class="stage-wrap" id="wrap">
      <div
        class="stage"
        id="stage"
        role="img"
        aria-label="별무리학교에서 BLMS를 만들었고, 모두의 문제를 위해 Altsis를 만들었습니다."
      >
        <div
          class="app"
          id="app"
          data-school="별무리학교"
          data-active="schedule"
          aria-hidden="true"
        >
          <div class="view is-on">
            <div class="cal">
              <div class="cal-top">
                <div>
                  <div class="cal-title">2026년 8월</div>
                  <div class="cal-sub">월</div>
                </div>
                <div class="cal-controls">
                  <div class="cal-btn">
                    <div class="cal-subBtn on">월</div>
                    <div class="cal-subBtn">주</div>
                  </div>
                </div>
              </div>
              <div class="cal-days">
                <span>일</span><span>월</span><span>화</span><span>수</span>
                <span>목</span><span>금</span><span>토</span>
              </div>
              <div class="cal-grid" id="grid"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="chrome">
      <a href="record.html">목록</a>
      <button type="button" id="play">다시 재생</button>
      <button type="button" id="record">녹화 화면</button>
      <span class="hint"><kbd>R</kbd> 재생 · <kbd>F</kbd> 전체화면 · 24초</span>
    </div>
    <script src="promo.js"></script>
    <script>
      Promo.bootPromo({
        durationMs: 24000,
        onReset() {
          Promo.setSchoolName("별무리학교", false);
          Promo.hideCopy();
        },
        beats: [
          {
            at: 400,
            run: () =>
              Promo.showCopy({
                veil: "heavy",
                line: "별무리학교의 교육을 바꾸기 위해,",
                sub: "BLMS를 만들었습니다",
              }),
          },
          {
            at: 4800,
            run: () =>
              Promo.showCopy({
                veil: "heavy",
                line: "한 학교의 실험이었습니다",
              }),
          },
          {
            at: 8800,
            run: () => {
              Promo.setSchoolName("Alt School", false);
              Promo.showCopy({
                veil: "heavy",
                line: "그 길은 한 학교만의 것이 아니었습니다",
              });
            },
          },
          {
            at: 13800,
            run: () =>
              Promo.showCopy({
                veil: "heavy",
                line: "모두의 문제를 위해,",
                sub: "Altsis를 만들었습니다",
              }),
          },
          {
            at: 18800,
            run: () =>
              Promo.showCopy({
                veil: "heavy",
                line: "모든 학교를 위한",
                sub: "대안적인 학교 정보 시스템",
              }),
          },
        ],
      });
    </script>
  </body>
</html>
