<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Altsis 홍보 영상 · 2분 52초</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="promo.css" />
    <style>
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #07070e;
      }
    </style>
  </head>
  <body>
    <div class="stage-wrap" id="wrap">
      <div class="stage" id="stage" aria-label="Altsis 홍보 영상 2분 52초">
        <iframe id="frame" title="장면" src="about:blank"></iframe>
      </div>
    </div>
    <div class="chrome">
      <a href="record.html">목록</a>
      <button type="button" id="play">다시 재생</button>
      <button type="button" id="record">녹화 화면</button>
      <span class="hint"
        ><kbd>R</kbd> 재생 · <kbd>F</kbd> 전체화면 · 2분 52초 한 테이크</span
      >
    </div>
    <script>
      const PLAYLIST = [
        { src: "opening.html?embed=1", ms: 8000 },
        { src: "origin.html?embed=1", ms: 24000 },
        { src: "alt.html?embed=1", ms: 40000 },
        { src: "shift.html?embed=1", ms: 70000 },
        { src: "ctrl.html?embed=1", ms: 22000 },
        { src: "closing.html?embed=1", ms: 8000 },
      ];
      const TOTAL = PLAYLIST.reduce((sum, item) => sum + item.ms, 0);
      const frame = document.getElementById("frame");
      const stage = document.getElementById("stage");
      const wrap = document.getElementById("wrap");
      let timers = [];
      let index = 0;

      function fitStage() {
        const sx = window.innerWidth / 1920;
        const sy = window.innerHeight / 1080;
        stage.style.setProperty("--scale", String(Math.min(sx, sy)));
      }

      function clearTimers() {
        while (timers.length) window.clearTimeout(timers.pop());
      }

      function show(i) {
        index = i;
        const item = PLAYLIST[i];
        if (!item) return;
        frame.src = item.src;
        timers.push(
          window.setTimeout(() => {
            if (i + 1 < PLAYLIST.length) show(i + 1);
          }, item.ms)
        );
      }

      function play() {
        clearTimers();
        show(0);
      }

      document.getElementById("play").addEventListener("click", play);
      document.getElementById("record").addEventListener("click", () => {
        document.body.classList.add("is-recording");
        play();
        timers.push(
          window.setTimeout(() => {
            document.body.classList.remove("is-recording");
            fitStage();
          }, TOTAL + 400)
        );
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "r" || event.key === "R") {
          event.preventDefault();
          play();
        }
        if (event.key === "f" || event.key === "F") {
          event.preventDefault();
          if (!document.fullscreenElement) wrap.requestFullscreen();
          else document.exitFullscreen();
        }
        if (event.key === "Escape") {
          document.body.classList.remove("is-recording");
          fitStage();
        }
      });

      window.addEventListener("resize", fitStage);
      document.addEventListener("fullscreenchange", () => {
        document.body.classList.toggle(
          "is-recording",
          Boolean(document.fullscreenElement)
        );
        fitStage();
      });

      fitStage();
      play();
    </script>
  </body>
</html>
