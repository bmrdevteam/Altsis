<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Altsis 클로징 · 8초</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="promo.css" />
  </head>
  <body>
    <div class="stage-wrap" id="wrap">
      <div
        class="stage"
        id="stage"
        role="img"
        aria-label="이제 이 시스템을 공개합니다. Altsis. 모든 학교를 위한 대안적인 학교 정보 시스템."
      >
        <div
          class="app"
          id="app"
          data-school="Alt School"
          data-active="schedule"
          aria-hidden="true"
        >
          <div class="view is-on">
            <div class="cal">
              <div class="cal-top">
                <div>
                  <div class="cal-title">2026년 8월</div>
                  <div class="cal-sub">월</div>
                </div>
                <div class="cal-controls">
                  <div class="cal-btn">
                    <div class="cal-subBtn on">월</div>
                    <div class="cal-subBtn">주</div>
                  </div>
                </div>
              </div>
              <div class="cal-days">
                <span>일</span><span>월</span><span>화</span><span>수</span>
                <span>목</span><span>금</span><span>토</span>
              </div>
              <div class="cal-grid" id="grid"></div>
            </div>
          </div>
        </div>
        <div class="brand">
          <div class="keys">
            <div class="key" id="keyAlt">
              <div class="face"><span class="name">Alt</span><span>⌥</span></div>
            </div>
            <div class="key wide" id="keyShift">
              <div class="face">
                <span class="name">Shift</span><span>⇧</span>
              </div>
            </div>
            <div class="key" id="keyCtrl">
              <div class="face">
                <span class="name">Ctrl</span><span>⌃</span>
              </div>
            </div>
          </div>
          <p class="sub ko fade" id="openLine">이제 이 시스템을 공개합니다</p>
          <div class="wordmark fade" id="word">Altsis</div>
          <p class="sub tag fade" id="tag">
            모든 학교를 위한 대안적인 학교 정보 시스템
          </p>
        </div>
      </div>
    </div>
    <div class="chrome">
      <a href="record.html">목록</a>
      <button type="button" id="play">다시 재생</button>
      <button type="button" id="record">녹화 화면</button>
      <span class="hint"><kbd>R</kbd> 재생 · <kbd>F</kbd> 전체화면 · 8초</span>
    </div>
    <script src="promo.js"></script>
    <script>
      const keys = [
        document.getElementById("keyAlt"),
        document.getElementById("keyShift"),
        document.getElementById("keyCtrl"),
      ];
      const openLine = document.getElementById("openLine");
      const word = document.getElementById("word");
      const tag = document.getElementById("tag");

      Promo.bootPromo({
        durationMs: 8000,
        onReset() {
          keys.forEach((key) => key.classList.remove("is-on", "is-press"));
          [openLine, word, tag].forEach((el) => el.classList.remove("is-on"));
          const veil = document.getElementById("copyVeil");
          veil.classList.add("is-on", "is-heavy");
        },
        beats: [
          { at: 500, run: () => keys[0].classList.add("is-on") },
          { at: 900, run: () => keys[0].classList.add("is-press") },
          { at: 1200, run: () => keys[0].classList.remove("is-press") },
          { at: 1300, run: () => keys[1].classList.add("is-on") },
          { at: 1700, run: () => keys[1].classList.add("is-press") },
          { at: 2000, run: () => keys[1].classList.remove("is-press") },
          { at: 2100, run: () => keys[2].classList.add("is-on") },
          { at: 2500, run: () => keys[2].classList.add("is-press") },
          { at: 2800, run: () => keys[2].classList.remove("is-press") },
          { at: 3200, run: () => openLine.classList.add("is-on") },
          { at: 4800, run: () => word.classList.add("is-on") },
          { at: 5400, run: () => tag.classList.add("is-on") },
        ],
      });
    </script>
  </body>
</html>
