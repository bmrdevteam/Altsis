<!DOCTYPE html>
<html lang="kr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0"/>
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Alternative School Information System"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Altsis Next</title>
  </head>
  <body>
    <noscript>Alternative School Information System V2.0</noscript>
    <div id="root"></div>
    <script>
      (function () {
        var delayMs = 8000;
        var shown = false;
        var root = document.getElementById("root");
        if (!root) return;

        function showRecover() {
          if (shown || root.childElementCount > 0) return;
          shown = true;
          var wrap = document.createElement("div");
          wrap.id = "boot-recover";
          wrap.setAttribute("role", "alert");
          wrap.style.cssText =
            "min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:sans-serif;box-sizing:border-box;";
          var msg = document.createElement("p");
          msg.textContent = "화면을 불러오지 못했습니다.";
          var btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = "새로고침";
          btn.style.cssText =
            "min-height:44px;padding:8px 16px;font-size:16px;cursor:pointer;";
          btn.addEventListener("click", function () {
            location.reload();
          });
          wrap.appendChild(msg);
          wrap.appendChild(btn);
          document.body.appendChild(wrap);
        }

        var timer = setTimeout(showRecover, delayMs);

        function cancel() {
          if (root.childElementCount === 0) return;
          clearTimeout(timer);
          var recover = document.getElementById("boot-recover");
          if (recover && recover.parentNode) recover.parentNode.removeChild(recover);
          if (obs) obs.disconnect();
        }

        var obs = null;
        if (typeof MutationObserver !== "undefined") {
          obs = new MutationObserver(cancel);
          obs.observe(root, { childList: true, subtree: true });
        }
      })();
    </script>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
