<!DOCTYPE html>
<html lang="kr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0"/>
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Altsis Next" />
    <meta
      name="description"
      content="Alternative School Information System"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Altsis Next</title>
  </head>
  <body>
    <noscript>Alternative School Information System V2.0</noscript>
    <div id="root"></div>
    <div
      id="boot-status"
      role="status"
      style="position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:sans-serif;box-sizing:border-box;background:#fff;"
    >
      <p>로딩중</p>
    </div>
    <script>
      (function () {
        var delayMs = 8000;
        var retryKey = "altsis-boot-retry";
        var shown = false;
        var root = document.getElementById("root");
        if (!root) return;

        function storageGet() {
          try {
            return sessionStorage.getItem(retryKey);
          } catch (e) {
            return "1";
          }
        }

        function storageSet() {
          try {
            sessionStorage.setItem(retryKey, "1");
            return true;
          } catch (e) {
            return false;
          }
        }

        function storageClear() {
          try {
            sessionStorage.removeItem(retryKey);
          } catch (e) {}
        }

        function isStandalone() {
          try {
            if (
              window.matchMedia &&
              window.matchMedia("(display-mode: standalone)").matches
            ) {
              return true;
            }
          } catch (e) {}
          return !!navigator.standalone;
        }

        function showFail() {
          if (shown || root.childElementCount > 0) return;
          shown = true;
          var wrap = document.getElementById("boot-status");
          if (!wrap) {
            wrap = document.createElement("div");
            wrap.id = "boot-status";
            wrap.style.cssText =
              "position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:sans-serif;box-sizing:border-box;background:#fff;";
            document.body.appendChild(wrap);
          }
          wrap.setAttribute("role", "alert");
          while (wrap.firstChild) {
            wrap.removeChild(wrap.firstChild);
          }
          var msg = document.createElement("p");
          msg.textContent = "화면을 불러오지 못했습니다.";
          wrap.appendChild(msg);
          if (isStandalone()) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = "새로고침";
            btn.style.cssText =
              "min-height:44px;padding:8px 16px;font-size:16px;cursor:pointer;";
            btn.addEventListener("click", function () {
              location.reload();
            });
            wrap.appendChild(btn);
          }
        }

        function onTimeout() {
          if (root.childElementCount > 0) return;
          if (storageGet() !== "1") {
            if (storageSet()) {
              location.reload();
              return;
            }
          }
          showFail();
        }

        var timer = setTimeout(onTimeout, delayMs);
        var obs = null;

        function cancel() {
          if (root.childElementCount === 0) return;
          clearTimeout(timer);
          storageClear();
          var status = document.getElementById("boot-status");
          if (status && status.parentNode) status.parentNode.removeChild(status);
          if (obs) obs.disconnect();
        }

        if (typeof MutationObserver !== "undefined") {
          obs = new MutationObserver(cancel);
          obs.observe(root, { childList: true, subtree: true });
        }
        cancel();
      })();
    </script>

      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
